# AI-assisted: written with Claude Code from the team's security plan.
# Every push and pull request: typecheck, lint, the full test suite (including the security tests),
# and a dependency audit. A red check means don't merge.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src tests next.config.ts
      - run: npm test
      # Known, documented findings (docs/security/accepted-risks.md) keep this informational; review the output.
      - run: npm audit --omit=dev --audit-level=critical || echo "::warning::npm audit reported findings; see docs/security/accepted-risks.md"
