# AI-assisted: written with Claude Code from the team's security plan.
# Weekly pull requests for dependency updates; security fixes arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
