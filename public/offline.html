<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilot Light: offline</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 20px; background: #f6f5f1; color: #1c1917; }
      main { max-width: 520px; margin: 0 auto; }
      h1 { font-size: 24px; }
      p { font-size: 18px; line-height: 1.5; }
      strong { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Pilot Light cannot reach the server from this device right now. The server keeps watching the household and will still text and call the contacts.</p>
      <p>Anything you changed is saved on this device and will be sent when you are back online.</p>
      <p><strong>Call 911 for any emergency.</strong></p>
    </main>
  </body>
</html>
